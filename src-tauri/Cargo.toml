[package]
name = "bento"
version = "0.0.1"
description = "Modular desktop workspace"
authors = ["Bento Contributors"]
edition = "2021"
default-run = "bento"

[[bin]]
name = "fake_cli"
path = "tests/fixtures/fake_cli.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bento-docker = { path = "../daemon/bento-docker", features = ["ts"] }
bento-review = { path = "../daemon/bento-review", features = ["ts"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
ts-rs = { version = "12.0", features = ["serde-json-impl"] }
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
futures = "0.3"
sysinfo = { version = "0.30", default-features = false }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(cargo_clippy)'] }

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.release]
opt-level = "z"
lto = true
