[package]
name = "bento-docker"
version = "0.1.0"
edition = "2021"

# Sin tauri ni axum: esto es lo que hace el panel de Docker, no cómo se pinta
# ni por dónde se pide.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
ts-rs = { version = "12.0", features = ["serde-json-impl"], optional = true }

[features]
# Solo la app de escritorio genera tipos TypeScript desde estas structs.
ts = ["dep:ts-rs"]
