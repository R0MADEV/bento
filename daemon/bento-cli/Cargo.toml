[package]
name = "bento-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bento"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "macros", "time", "signal", "sync"] }
serde_json = "1.0"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio-stream = { version = "0.1", default-features = false }
# Solo por los perfiles de terminal: los PTY los abre el daemon.
bento-core = { path = "../bento-core" }
bento-review = { path = "../bento-review" }
bento-sessions = { path = "../bento-sessions" }
vt100 = "0.16.2"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
