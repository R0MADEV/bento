[package]
name = "bento-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bento-daemon"
path = "src/main.rs"

[dependencies]
bento-core = { path = "../bento-core" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "process"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Phone remote: HTTP + WebSocket server that bridges terminals to the browser.
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
getrandom = "0.2"
# WebRTC remote control: P2P DataChannel to the phone, bypassing Tailscale.
webrtc = "0.20.3"
# Direct dep only for rtc::ice::mdns::MulticastDnsMode — the `webrtc` crate
# re-exports SettingEngine (which needs this type) but not the type itself.
# Must match webrtc's own `rtc` version so Cargo unifies them.
rtc = "0.20.3"
async-trait = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio-tungstenite = { version = "0.24", default-features = false }
base64 = "0.22"
