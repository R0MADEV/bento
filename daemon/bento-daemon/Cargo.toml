[package]
name = "bento-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bento-daemon"
path = "src/main.rs"

[dependencies]
bento-core = { path = "../bento-core" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
