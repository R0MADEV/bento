[package]
name = "bento-review"
version = "0.1.0"
edition = "2021"

# Deliberately free of tauri/axum: this crate is the review logic the desktop
# app, the daemon (phone remote) and the CLI all share, so it must not depend
# on any one of their transports.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = { version = "12.0", features = ["serde-json-impl"], optional = true }
tokio = { version = "1", features = ["process", "io-util", "rt", "time", "sync", "macros"] }
futures = "0.3.34"

[features]
# La app de escritorio genera los tipos TypeScript desde estas structs; el
# daemon y el CLI no necesitan ts-rs para nada.
ts = ["dep:ts-rs"]

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt"] }
