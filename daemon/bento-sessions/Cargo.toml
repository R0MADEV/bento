[package]
name = "bento-sessions"
version = "0.1.0"
edition = "2021"

# Dónde deja cada agente su sesión y el scrollback que Bento conserva. Sin
# tauri: lo comparten el panel de agentes, el daemon y el CLI.
[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
